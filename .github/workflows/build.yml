name: Build Windows

# Windows only: the Linux, macOS and release pipelines live in
# `.forgejo/workflows/` and run on the Forgejo instance, which is where releases
# are published now. This workflow stays on GitHub for the one platform Forgejo
# has no runner for -- the MSI needs vcpkg and WiX on a Windows host.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          $version = if ($tag) { $tag -replace '^v', '' } else { '0.0.0' }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg and ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.ref_name }}

      - name: Convert icon to .ico
        shell: pwsh
        run: |
          if (-not (Test-Path "Resources/P2ProViewer.ico")) {
            # The .ico is generated from the PNG with ImageMagick, which the
            # windows-latest image ships.
            magick Resources/icon.png -define icon:auto-resize=256,128,64,48,32,16 Resources/P2ProViewer.ico
          }

      - name: Initialize vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git
          }
          cd vcpkg
          git checkout master
          git pull

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DAPP_VERSION="${{ steps.version.outputs.version }}" `
            -DUSE_FFMPEG=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (zip)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $dist = "dist/P2ProViewer-Windows"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "build/Release/P2ProViewer.exe" $dist
          Copy-Item "build/Release/*.dll" $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "dist/P2ProViewer-windows.zip"

      - name: Package (MSI)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $env:PATH += ";$env:ProgramFiles\WiX Toolset v3.14\bin"
          }
          New-Item -ItemType Directory -Force -Path dist
          cd build
          cpack -G WIX -C Release
          Move-Item *.msi ../dist/

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/P2ProViewer-windows.zip
            dist/*.msi
          if-no-files-found: error
