name: Reusable build

# Reusable build/packaging workflow for P2ProViewer, modelled on the same
# workflow in MacwakeFaktura and Owon1041. Called by:
#   * ci.yml      (development build: every platform compiles, nothing uploaded)
#   * main.yml    (push to main: Linux compile only, then the tag job)
#   * release.yml (tag: packaged .deb, .dmg, Windows zip and MSI, uploaded for
#                  the publish job)
#
# Forgejo note: on.workflow_call accepts only `inputs` and `outputs`; callers
# pass `secrets: inherit` and this workflow reads secrets.NAME as if declared.
on:
  workflow_call:
    inputs:
      app_version:
        description: Version to bake in; empty takes the latest tag.
        required: false
        type: string
        default: ''
      artifact_name_prefix:
        required: false
        type: string
        default: 'package'
      # Only the release build uploads: its bundles are what the central
      # publish job (tools/ci publish.yml) downloads. A test build's outputs
      # are never read, and every bundle stored on the forge costs disk.
      #
      # A string rather than a boolean, like `linux`/`macos` above: the docker
      # runner compares workflow_call inputs against the string "true" only, so
      # a boolean `true` (or a boolean default) reads as false in `if:` and the
      # upload is skipped without a word — which is how the .deb went missing
      # from the release and made the publish job fail on "Missing release
      # assets". Fixed in forgejo-runner v12.7.1 (forgejo/runner#1388); the
      # forge's docker runner is older, and 'ON'/'OFF' works on both.
      upload_artifacts:
        required: false
        type: string
        default: 'ON'
      linux:
        description: Build the Debian package.
        required: false
        type: string
        default: 'ON'
      macos:
        description: Build the macOS app and .dmg.
        required: false
        type: string
        default: 'ON'
      macos_runner:
        required: false
        type: string
        default: 'macos-arm64'
      windows:
        description: Build the Windows zip and MSI.
        required: false
        type: string
        default: 'ON'

jobs:
  build-deb:
    if: inputs.linux == 'ON'
    runs-on: docker
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config dpkg-dev file nodejs \
            libsdl2-dev libsdl2-ttf-dev libusb-1.0-0-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev
      # Full history: the fallback version is `git describe --tags`, and the
      # default single-commit clone carries no tags.
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      # The version reaches the build as -DAPP_VERSION; a release passes the tag
      # it was started from, everything else falls back to the newest tag.
      - name: Get version
        id: get_version
        run: |
          if [ -n "${{ inputs.app_version }}" ]; then
            VERSION_STR="${{ inputs.app_version }}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            VERSION_STR="${LATEST_TAG#v}"
          fi
          echo "version=${VERSION_STR:-0.0.0}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION="${{ steps.get_version.outputs.version }}"
          cmake --build build
      # CPack writes the .deb with the Debian metadata CMakeLists.txt declares.
      - name: Package .deb
        run: cd build && cpack -G DEB
      - name: Upload artifacts
        if: inputs.upload_artifacts == 'ON'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ steps.get_version.outputs.version }}
          path: build/*.deb
          if-no-files-found: error

  build-macos:
    if: inputs.macos == 'ON'
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 90
    steps:
      # Full history: the fallback version is `git describe --tags`, and the
      # default single-commit clone carries no tags.
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version
        id: get_version
        run: |
          if [ -n "${{ inputs.app_version }}" ]; then
            VERSION_STR="${{ inputs.app_version }}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            VERSION_STR="${LATEST_TAG#v}"
          fi
          echo "version=${VERSION_STR:-0.0.0}" >> "$GITHUB_OUTPUT"
        shell: bash
      # SDL2 and SDL2_ttf come from Homebrew on this runner; dylibbundler is
      # what bundle_macos.sh uses to copy them into the .app.
      - name: Install dependencies
        run: |
          command -v brew >/dev/null || { echo "Homebrew is missing on this runner" >&2; exit 1; }
          brew install --quiet pkg-config sdl2 sdl2_ttf dylibbundler
      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION="${{ steps.get_version.outputs.version }}"
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
      - name: Bundle and package
        env:
          APP_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p dist
          BUILD_DIR=build ./bundle_macos.sh
          hdiutil create -volname P2ProViewer -srcfolder P2ProViewer.app \
            -ov -format UDZO "dist/P2ProViewer-${APP_VERSION}-macos-universal.dmg"
      - name: Upload artifacts
        if: inputs.upload_artifacts == 'ON'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name_prefix }}-macos-${{ steps.get_version.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    if: inputs.windows == 'ON'
    # The windows-amd64 runner is provisioned by the ansible repo's
    # configure_windows_build_host.yml (MSVC, CMake, vcpkg, WiX, ImageMagick,
    # ccache, PowerShell 7), so this job only builds and packages.
    runs-on: windows-amd64
    timeout-minutes: 90
    # The runner keeps vcpkg and ccache across jobs; the project's vcpkg.json
    # pins the baseline, and vcpkg resolves it from this full clone.
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
    steps:
      # Full history: the fallback version is `git describe --tags`, and the
      # default single-commit clone carries no tags.
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $appVersion = "${{ inputs.app_version }}"
          if ($appVersion) {
              $version = $appVersion
          } else {
              $version = (git describe --tags --abbrev=0 2>$null) -replace '^v', ''
              if (-not $version) { $version = '0.0.0' }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      # CPack's WIX generator takes the icon from Resources/P2ProViewer.ico.
      - name: Convert icon to .ico
        shell: pwsh
        run: magick "Resources/icon.png" -define icon:auto-resize=256,128,64,48,32,16 "Resources/P2ProViewer.ico"
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DAPP_VERSION="${{ steps.get_version.outputs.version }}" `
            -DUSE_FFMPEG=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Package zip and MSI
        shell: pwsh
        run: |
          $dist = "dist/P2ProViewer-Windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build/Release/P2ProViewer.exe" $dist
          Copy-Item "build/Release/*.dll" $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "dist/P2ProViewer-windows.zip" -Force
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
              throw "candle.exe not found; the windows-amd64 runner needs WiX Toolset 3.14 on PATH"
          }
          Push-Location build
          try {
              cpack -G WIX -C Release
              $rc = $LASTEXITCODE
          } finally {
              Pop-Location
          }
          if ($rc -ne 0) { throw 'cpack failed' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item build/*.msi dist/ -Force
      - name: Upload artifacts
        if: inputs.upload_artifacts == 'ON'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name_prefix }}-windows-${{ steps.get_version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
